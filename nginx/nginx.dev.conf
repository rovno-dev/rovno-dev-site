events {}

http {
  upstream frontend {
    # 'host.docker.internal' is a special DNS name that resolves 
    # to the host machine (your computer) from inside the Docker container.
    server host.docker.internal:3000;
  }

  upstream orders {
    # Assuming 'orders' is still running in a Docker container.
    # If orders is ALSO running locally, change this to host.docker.internal:8080
    server orders:8080;
  }

  server {
    listen 80;
    server_name _;

    # ===== FRONTEND =====
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # IMPORTANT: Required for Next.js Hot Module Replacement (HMR)
      # If you miss this, you will see WebSocket errors in the browser console
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # ===== ORDERS API =====
    location /api/orders/ {
      proxy_pass http://orders/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}