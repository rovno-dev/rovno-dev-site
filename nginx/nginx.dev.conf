events {}

http {
  upstream orders {
    # Assuming 'orders' is still running in a Docker container.
    # If orders is ALSO running locally, change this to host.docker.internal:8080
    server orders:8080;
  }

  server {
    listen 80;
    server_name _;

    # ===== ORDERS API =====
    location /api/orders/ {
      proxy_pass http://orders/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}