events {}

http {
  upstream frontend {
    server frontend:3000;
  }

  upstream orders {
    server orders:8080;
  }

  server {
    listen 80;
    server_name _;

    # ===== FRONTEND =====
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===== ORDERS API =====
    location /api/orders/ {
      proxy_pass http://orders/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
