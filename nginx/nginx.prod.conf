events {}

http {
  upstream frontend {
    server frontend:3000;
  }

  upstream orders {
    server orders:8080;
  }

  server {
    listen 80;
    server_name rovno.dev www.rovno.dev;
    return 301 https://$host$request_uri;
  }
  server {
    listen 443 ssl;
    server_name rovno.dev www.rovno.dev;

    ssl_certificate /etc/nginx/ssl/live/rovno.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/rovno.dev/privkey.pem;

    # ===== FRONTEND =====
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===== ORDERS API =====
    location /api/orders/ {
      proxy_pass http://orders/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
